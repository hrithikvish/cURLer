name: Release on Play Store Internal Track

on:
  workflow_dispatch:
    inputs:
      bump_version_code:
        description: 'Bump versionCode'
        type: boolean
        default: true

concurrency:
  group: playstore-internal-release
  cancel-in-progress: true

jobs:
  build:
    name: Release on Play Store Internal Track
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GRADLE_OPTS: >
        -Xmx6g
        -Dkotlin.daemon.jvm.options=-Xmx2g

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bump versionCode
        id: bump_code
        if: github.event_name == 'workflow_dispatch' && inputs.bump_version_code
        run: |
          FILE=gradle/libs.versions.toml
          CURRENT_CODE=$(grep -oE 'versionCode = "[0-9]+"' "$FILE" | grep -oE '[0-9]+')
          NEW_CODE=$((CURRENT_CODE + 1))

          sed -i "s/versionCode = \"$CURRENT_CODE\"/versionCode = \"$NEW_CODE\"/" "$FILE"

          echo "Bumped versionCode $CURRENT_CODE -> $NEW_CODE"
          echo "version_code=$NEW_CODE" >> "$GITHUB_OUTPUT"

      - name: Commit and push version bump
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle/libs.versions.toml
          if git diff --cached --quiet; then
            echo "No version bump to commit"
          else
            git commit -m "chore: Bump versionCode to ${{ steps.bump_code.outputs.version_code }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-cleanup: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > keystore/curler-release-keystore.jks

      - name: Write keystore.properties
        run: |
          cat > keystore.properties <<EOF
          storeFile=keystore/curler-release-keystore.jks
          storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Assemble Release Bundle
        run: |
          ./gradlew :app:bundleRelease \
            --build-cache \
            --parallel \
            --no-daemon

      - name: Generate release notes from commit message
        run: |
          mkdir -p whatsNew
          git log -1 --pretty=%B "$GITHUB_SHA" > whatsNew/whatsnew-en-US
          echo "Release notes:"
          cat whatsNew/whatsnew-en-US

      - name: Setup Authorization with Google Play Store
        run: echo '${{ secrets.PLAY_AUTH_JSON }}' > service_account.json

      - name: Deploy bundle to Google Play
        uses: r0adkll/upload-google-play@v1.1.4
        with:
          serviceAccountJson: service_account.json
          packageName: com.hrithikvish.curler
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          whatsNewDirectory: whatsNew/
