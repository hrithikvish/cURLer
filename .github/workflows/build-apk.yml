name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Assemble and upload APKs
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: >
        -Xmx6g
        -Dkotlin.daemon.jvm.options=-Xmx2g

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Generate release notes from commit message
        run: |
          git log -1 --pretty=%B "$GITHUB_SHA" > release_notes.txt
          echo "Release notes:"
          cat release_notes.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-cleanup: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble Debug APKs (split by ABI)
        run: |
          ./gradlew :app:assembleDebug \
            --build-cache \
            --parallel \
            --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: cURLer-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Debug APK to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: 1:65458384131:android:4faac751a692939deb8d36
          serviceCredentialsFileContent: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          groups: curlers
          file: app/build/outputs/apk/debug/cURLer_debug_arm64-v8a.apk
          releaseNotesFile: release_notes.txt
